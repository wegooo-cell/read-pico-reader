name: build

on:
  push:
    branches: [main, codex/metalio-s31-test30]
  pull_request:
  workflow_dispatch:

jobs:
  display-host-tests:
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Clang for sanitizer host regressions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kiiko-host-cc"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/kiiko-host-cc/cc"
          echo "$RUNNER_TEMP/kiiko-host-cc" >> "$GITHUB_PATH"
      - name: Board selection and Pico host-test view
        shell: bash
        run: |
          python3 tools/license_notices_host_test.py
          python3 tools/tls_bundle_host_test.py
          python3 tools/ota_tls_host_test.py
          python3 tools/pr59_driver_baseline_host_test.py
          python3 tools/board_layer_host_test.py
          python3 tools/board_selection_host_test.py
          python3 tools/board_source_view.py --board pico --tests --output build/host/pico
      - name: S31 pipeline, power and cache regressions
        shell: bash
        run: |
          python3 tools/test_s31_pipeline_lut.py
          python3 tools/test_s31_lcd_interrupt_guard.py
          python3 tools/test_s31_dma_chain.py
          python3 tools/test_s31_line_queue.py
          python3 tools/test_s31_radio_margin.py
          python3 tools/test_home_minute_present.py
          bash tools/run_metalio_cover_cache_host_test.sh
          python3 tools/board_source_view.py --board metalio47 --tests --output build/host/metalio47
          python3 build/host/metalio47/tools/metalio_vcom_host_test.py
          python3 build/host/metalio47/tools/test_glass_geometry.py
          python3 build/host/metalio47/tools/metalio_clock_cache_host_test.py
      - name: S31 sleep, power-off and unlock boundaries
        shell: bash
        working-directory: build/host/metalio47
        run: |
          python3 tools/metalio_sleep_host_test.py
          python3 tools/metalio_light_transaction_host_test.py
          python3 tools/metalio_deep_sleep_host_test.py
          python3 tools/metalio_poweroff_host_test.py
          python3 tools/metalio_boot_wake_host_test.py
          python3 tools/metalio_lock_key_host_test.py
          python3 tools/metalio_lock_resume_host_test.py
          python3 tools/metalio_mount_resume_host_test.py
          python3 tools/txt_utf16_host_test.py
          python3 tools/metalio_wake_media_recovery_host_test.py
          python3 tools/metalio_power_choice_host_test.py
          python3 tools/settings_layout_font_host_test.py
          mkdir -p build/book-tests
          cc -std=c11 -D_DEFAULT_SOURCE -DKIIKO_BOARD_METALIO47=1 -Wall -Wextra -Werror -fsanitize=address,undefined -Itools/settings_backup_stubs -Imain tools/boot_state_host_test.c -o build/book-tests/boot-state
          build/book-tests/boot-state
      - name: Water-turn, display recovery, navigation and waveform regressions
        shell: bash
        working-directory: build/host/pico
        run: |
          bash tools/run_water_turn_host_test.sh
          bash tools/run_display_host_test.sh
          bash tools/run_display_navigation_tests.sh
          python3 tools/pmic_gate_host_test.py
          python3 tools/boot_panel_actions_host_test.py
          python3 tools/lock_pin_host_test.py
          python3 tools/lock_screen_host_test.py
          python3 tools/font_picker_catalog_host_test.py
          python3 tools/font_catalog_host_test.py
          python3 tools/power_double_click_host_test.py
          python3 tools/pico_wake_option_host_test.py
          python3 tools/pico_lock_hint_host_test.py
          python3 tools/pico_lock_wait_host_test.py
          python3 tools/factory_reset_host_test.py
          python3 tools/factory_reset_ui_host_test.py
          python3 tools/book_excerpt_host_test.py
          python3 tools/custom_media_dirs_host_test.py
          python3 tools/pager_host_test.py
          python3 tools/quick_layer_raster_host_test.py
          python3 tools/test_epd_difference_bounds.py --check-regression
          python3 tools/test_s31_pie_dispatch.py
          python3 tools/test_lcd_frame_lifecycle.py
          sh tools/run_app_loop_host_tests.sh
          python3 tools/reader_spacing_host_test.py
          python3 tools/test_book_toc.py
          node tools/flasher_integrity_host_test.cjs
          python3 tools/vertical_punctuation_host_test.py
          python3 tools/vertical_number_host_test.py

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [pico, metalio47]
    # v6.1 includes both Xtensa S3 and RISC-V S31; never share their build/config directories.
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate the selected board package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          extra=()
          if [ "${{ matrix.board }}" = metalio47 ]; then extra=(--s31-pie --s31-text-ripple --s31-reader-panel37); fi
          python tools/build_firmware.py --board "${{ matrix.board }}" \
            --idf-${{ matrix.board }} "$IDF_PATH" --python "$(command -v python)" \
            --output build/boards "${extra[@]}"
          if [ "${{ matrix.board }}" = pico ]; then
            python tools/lowzag_host_test.py --component build/boards/pico/source/managed_components/defensiblelogic__lowzag
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: build/boards/packages/

  board-reader-tests:
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [pico, metalio47]
    steps:
      - uses: actions/checkout@v4
      - name: Select Clang for sanitizer host regressions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kiiko-host-cc"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/kiiko-host-cc/cc"
          echo "$RUNNER_TEMP/kiiko-host-cc" >> "$GITHUB_PATH"
      - name: Materialize and test reader/UI/settings for this board
        shell: bash
        run: |
          if [ "${{ matrix.board }}" = metalio47 ]; then
            python3 tools/metalio_reader_soft_turn_host_test.py
            python3 tools/metalio_text_batch_host_test.py
          fi
          python3 tools/board_source_view.py --board "${{ matrix.board }}" --tests --output build/host/${{ matrix.board }}
          cd build/host/${{ matrix.board }}
          mkdir -p build/book-tests/settings-card
          cc -std=c11 -D_DEFAULT_SOURCE -Wall -Wextra -Werror -g -fsanitize=address,undefined -fno-omit-frame-pointer -Imain/book -Imain -Itools/book_layout_stubs -Itools/book_source_host_stubs tools/book_layout_host_test.c main/book/book_layout.c main/book/html_text.c -o build/book-tests/layout
          build/book-tests/layout
          python3 tools/gen_english_hyphen.py --check
          python3 tools/english_hyphen_host_test.py
          if [ "${{ matrix.board }}" = "metalio47" ]; then
            python3 tools/metalio_du14_host_test.py
            python3 tools/metalio_du14_white_host_test.py
          fi
          python3 tools/title_font_host_test.py
          python3 tools/file_names_host_test.py
          python3 tools/txt_navigation_host_test.py
          if [ "${{ matrix.board }}" = "metalio47" ]; then
            python3 tools/txt_volume_host_test.py --s31
          else
            python3 tools/txt_volume_host_test.py
          fi
          python3 tools/test_book_toc.py
          python3 tools/liquid_shelf_style_host_test.py
          python3 tools/shelf_guard_cache_host_test.py
          python3 tools/management_layout_host_test.py
          python3 tools/webp_host_test.py
          python3 tools/reader_metadata_host_test.py
          python3 tools/setup_state_host_test.py
          python3 tools/setup_navigation_host_test.py
          python3 tools/ui_locale_host_test.py
          python3 tools/reading_settings_host_test.py
          python3 tools/reader_controls_host_test.py
          python3 tools/reader_ui_scale_host_test.py
          python3 tools/reader_refresh_release_host_test.py
          python3 tools/reader_fullscreen_host_test.py
          python3 tools/lock_screen_host_test.py
          python3 tools/power_double_click_host_test.py
          cc -std=gnu11 -Wall -Wextra -Werror -Itools/settings_backup_stubs \
            -Icomponents/read_pico_transfer/include tools/settings_backup_host_test.c -o build/settings-backup
          build/settings-backup
          sh tools/run_app_loop_host_tests.sh
          bash tools/run_display_navigation_tests.sh

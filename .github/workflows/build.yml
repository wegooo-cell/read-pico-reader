name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 钉在 v6.1 发布点。release-v6.1 分支会继续演进，LCD LL 接口已经变过一次。
    # Pin to the v6.1 release. The release-v6.1 branch keeps moving; the LCD LL API already changed once.
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4

      # sdkconfig.defaults 里的 120MHz flash / PSRAM 依赖真机的 flash 型号，
      # CI 用 sdkconfig.ci 换成默认时序，只验证能不能编过。
      # The 120 MHz flash / PSRAM timing in sdkconfig.defaults needs the real
      # flash part; CI uses sdkconfig.ci (default timing) and only checks that it compiles.
      - name: build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -DSDKCONFIG_DEFAULTS=sdkconfig.ci set-target esp32s3
          idf.py -DSDKCONFIG_DEFAULTS=sdkconfig.ci build

      - name: size
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py size

      - name: shelf and ripple host regressions
        shell: bash
        run: |
          mkdir -p build/book-tests/settings-card
          cc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Itools/settings_backup_stubs -Icomponents/read_pico_transfer/include \
            tools/settings_backup_host_test.c -o build/book-tests/settings-backup
          build/book-tests/settings-backup
          bash tools/run_water_turn_host_test.sh
          python3 tools/clear_shelf_host_test.py
          python3 tools/settings_scroll_host_test.py
          python3 tools/ui_refresh_feedback_host_test.py
          python3 tools/ui_font_coverage_host_test.py
